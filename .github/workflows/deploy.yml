name: Deploy to EC2

# EC2削除済みのため、pushでの自動実行は停止し手動実行のみにしている
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: EC2にSSH接続してデプロイ
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd Skylog
            git pull origin main
            docker-compose up --build -d
