
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見つかりません | Skylog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --sky-500: #0ea5e9; --sky-600: #0284c7;
            --slate-200: #e2e8f0; --slate-400: #94a3b8;
            --slate-800: #1e293b; --white: #ffffff;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 2rem;
        }
        .error-box { text-align: center; max-width: 400px; }
        .error-code { font-family: 'Syne', sans-serif; font-size: 5rem; color: var(--slate-200); letter-spacing: -4px; line-height: 1; margin-bottom: 1rem; }
        .error-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; color: var(--slate-800); margin-bottom: 0.75rem; }
        .error-msg { font-size: 0.9rem; color: var(--slate-400); margin-bottom: 2rem; line-height: 1.6; }
        .btn-home { display: inline-flex; align-items: center; gap: 6px; padding: 11px 24px; background: var(--sky-500); color: var(--white); border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.15s; }
        .btn-home:hover { background: var(--sky-600); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <h1 class="error-title">メモが見つかりません</h1>
        <p class="error-msg">お探しのメモは存在しないか、<br>削除された可能性があります。</p>
        <a class="btn-home" th:href="@{/memos}">← メモ一覧に戻る</a>
    </div>
</body>
</html>
