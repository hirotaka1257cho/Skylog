<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | Skylog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --sky-50: #f0f7ff; --sky-100: #e0effe; --sky-400: #38bdf8;
            --sky-500: #0ea5e9; --sky-600: #0284c7;
            --slate-200: #e2e8f0; --slate-400: #94a3b8; --slate-600: #475569;
            --slate-800: #1e293b; --slate-900: #0f172a; --white: #ffffff;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #e0effe 50%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-container { width: 100%; max-width: 440px; }
        .brand { text-align: center; margin-bottom: 1.5rem; }
        .brand-name { font-family: 'Syne', sans-serif; font-size: 2rem; color: var(--sky-600); letter-spacing: -1px; }
        .brand-sub { font-size: 0.85rem; color: var(--slate-400); margin-top: 4px; }
        .card {
            background: var(--white);
            border: 1px solid var(--slate-200);
            border-radius: 16px;
            padding: 2.25rem 2rem;
            box-shadow: 0 4px 24px rgba(14,165,233,0.08), 0 1px 4px rgba(0,0,0,0.04);
        }
        .card-title { font-family: 'Syne', sans-serif; font-size: 1.2rem; color: var(--slate-900); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.1rem; }
        label {
            display: block; font-size: 0.78rem; font-weight: 500;
            color: var(--slate-600); margin-bottom: 5px;
            letter-spacing: 0.04em; text-transform: uppercase;
        }
        input {
            width: 100%; padding: 11px 14px;
            border: 1.5px solid var(--slate-200); border-radius: 8px;
            font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
            color: var(--slate-800); outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus { border-color: var(--sky-400); box-shadow: 0 0 0 3px rgba(56,189,248,0.12); }
        .error-msg { display: block; font-size: 0.8rem; color: #e11d48; margin-top: 4px; }
        .btn-submit {
            width: 100%; padding: 12px;
            background: var(--sky-500); color: var(--white);
            border: none; border-radius: 8px;
            font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
            font-weight: 500; cursor: pointer; margin-top: 0.5rem;
            transition: background 0.15s;
        }
        .btn-submit:hover { background: var(--sky-600); }
        .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--slate-400); }
        .auth-footer a { color: var(--sky-600); text-decoration: none; font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand">
            <div class="brand-name">Skylog</div>
            <div class="brand-sub">今日の空を、記録しよう</div>
        </div>
        <div class="card">
            <p class="card-title">新規登録</p>
            <form th:action="@{/users/register}" method="post" th:object="${registerForm}">
                <div class="form-group">
                    <label>名前</label>
                    <input type="text" th:field="*{name}" placeholder="山田 太郎">
                    <span class="error-msg" th:errors="*{name}"></span>
                </div>
                <div class="form-group">
                    <label>メールアドレス</label>
                    <input type="text" th:field="*{email}" placeholder="example@email.com">
                    <span class="error-msg" th:errors="*{email}"></span>
                </div>
                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" th:field="*{password}" placeholder="8〜16文字">
                    <span class="error-msg" th:errors="*{password}"></span>
                </div>
                <div class="form-group">
                    <label>パスワード（確認用）</label>
                    <input type="password" th:field="*{confirmPassword}" placeholder="もう一度入力">
                    <span class="error-msg" th:errors="*{confirmPassword}"></span>
                </div>
                <button class="btn-submit" type="submit">アカウントを作成</button>
            </form>
        </div>
        <div class="auth-footer">
            すでにアカウントをお持ちの方は
            <a th:href="@{/users/login}">ログイン</a>
        </div>
    </div>
</body>
</html>
